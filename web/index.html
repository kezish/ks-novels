<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171f2e">
  <title>小说 TXT 下载</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <div class="eyebrow">多书源 · TXT 下载</div>
      <h1>小说下载</h1>
      <p><a href="/daily">每日新书</a></p>
      <form method="post" action="/logout"><button class="secondary" type="submit">退出登录</button></form>
      <p class="muted">粘贴小说主页链接，每行一本。服务器处理完成后，将独立 TXT 保存到当前设备。</p>
    </header>
    <section class="card" id="sourcekit-panel" hidden aria-label="多书源搜索">
      <h2>小说搜索</h2>
      <form id="sourcekit-search">
        <label for="search-keyword">书名或作者</label>
        <input id="search-keyword" maxlength="100" required autocomplete="off" placeholder="输入书名或作者">
        <div id="search-sources" class="actions"></div>
        <div class="actions"><button type="submit" id="search-submit">搜索</button></div>
      </form>
      <div id="search-status" class="muted small" role="status"></div>
      <div id="search-results" aria-live="polite"></div>
      <p class="muted small">选择结果加入下方链接列表，再批量下载。久久仅搜索已同步书单，可直接下载原站 TXT。</p>
    </section>
    <section class="card" aria-label="提交小说">
      <form id="submit-form">
        <label for="links">小说主页链接</label>
        <textarea id="links" spellcheck="false" autocapitalize="off" autocomplete="off"
          placeholder="https://www.52shuku.net/yanqing/17_b/bkfXm.html" rows="6" required></textarea>
        <div class="actions">
          <button id="submit" type="submit">加入下载队列</button>
          <button id="queue-only" class="secondary" type="submit" hidden>仅加入队列（手动保存）</button>
          <span class="muted small">每批最多 30 本，重复链接自动合并</span>
        </div>
      </form>
      <p id="message" role="status" class="message" aria-live="polite"></p>
    </section>
    <section class="card">
      <div class="row">
        <h2>下载任务</h2>
        <button id="refresh" class="secondary" type="button">刷新</button>
      </div>
      <p id="save-hint" class="muted small">点击「下载 TXT」，文件由浏览器保存到当前设备。</p>
      <div class="actions" id="folder-actions" hidden>
        <button id="save-all" class="secondary" type="button">选择文件夹补存已完成 TXT</button>
        <span class="muted small">每本是独立 TXT，无 ZIP 文件。</span>
      </div>
      <div id="batches" aria-live="polite"><p class="muted">读取任务中…</p></div>
    </section>
    <footer class="muted small">
      文件在服务器上只临时保留 12 小时。支持文件夹授权的浏览器可一次选择、逐本自动保存（请保持本页打开）；iPhone Chrome 需逐本点击下载。
    </footer>
  </main>
</body>
</html>
