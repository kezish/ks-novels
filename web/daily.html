<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f3"><title>每日新书</title>
<link rel="stylesheet" href="/assets/daily.css?v=6">
<script src="/assets/daily.js?v=6" defer></script>
</head>
<body>
<main>
<header class="top"><div class="brand"><h1>ks-novels</h1><span>每日新书</span></div><form method="post" action="/logout"><button class="quiet" type="submit">退出</button></form></header>
<section id="sync-panel" class="sync-panel" aria-label="小说同步进度">
<div class="sync-head"><strong>小说同步</strong><span id="sync-state" role="status">读取状态…</span></div>
<progress id="sync-progress" max="1" aria-label="同步阶段完成进度"></progress>
<p id="sync-info" class="sync-info"></p>
<p id="sync-detail" class="sync-info"></p>
<div id="sync-page-wrap" hidden><label id="sync-page-label" class="sync-info" for="sync-page-progress">当前页</label><progress id="sync-page-progress" max="1"></progress></div>
<details id="sync-more"><summary>各书源进度</summary><div id="sync-stages"></div></details>
</section>
<nav class="date-row" aria-label="日期"><button id="prev" aria-label="前一天">‹</button><input type="date" id="date" aria-label="书单日期"><button id="next" aria-label="后一天">›</button></nav>
<section class="daily-filter"><div id="category-tabs" class="category-tabs" aria-label="小说类型"></div><select id="category" hidden aria-label="类型"><option value="">全部</option></select><details class="daily-options"><summary>更多筛选 <span class="muted">书源 / 榜单</span></summary><div class="filters"><label>书源 <select id="source"><option value="">全部</option><option value="jiujiu">久久</option><option value="52shuku">52书库</option></select></label><label>榜单 <select id="mode"><option value="">全部</option><option value="latest_upload">最新上传</option><option value="new_book">新书</option></select></label></div></details></section>
<p id="status" role="status" aria-live="polite"></p>
<section class="book-list" id="books" aria-label="小说列表"></section>
</main>
<nav class="bottom" aria-label="主导航"><a class="nav-button" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>搜索</a><a class="nav-button" href="/daily" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round"><path d="M12 5c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-4-1-7-1-10 1zM12 5v15"/></svg>每日新书</a><a class="nav-button" href="/#queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg>下载列表</a></nav>
</body>
</html>
