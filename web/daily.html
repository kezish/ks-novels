<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日新书</title>
<link rel="stylesheet" href="/assets/daily.css">
<script src="/assets/daily.js" defer></script>
</head>
<body>
<main>
<header><h1>每日新书</h1><a href="/">原下载工具</a><form method="post" action="/logout"><button type="submit">退出登录</button></form></header>
<section id="sync-panel" class="sync-panel" aria-label="小说同步进度">
<div class="sync-head"><strong>小说同步</strong><span id="sync-state" role="status">读取状态…</span></div>
<progress id="sync-progress" max="1" aria-label="同步阶段完成进度"></progress>
<p id="sync-info" class="sync-info"></p>
<p id="sync-detail" class="sync-info"></p>
<div id="sync-page-wrap" hidden><label id="sync-page-label" class="sync-info" for="sync-page-progress">当前页</label><progress id="sync-page-progress" max="1"></progress></div>
<details id="sync-more"><summary>各书源进度</summary><div id="sync-stages"></div></details>
</section>
<nav aria-label="日期"><button id="prev">前一天</button><input type="date" id="date" aria-label="书单日期"><button id="next">后一天</button></nav>
<section class="filters"><label>书源 <select id="source"><option value="">全部</option><option value="jiujiu">久久</option><option value="52shuku">52书库</option></select></label><label>类型 <select id="category"><option value="">全部</option></select></label><label>榜单 <select id="mode"><option value="">全部</option><option value="latest_upload">最新上传</option><option value="new_book">新书</option></select></label></section>
<p id="status" role="status" aria-live="polite"></p>
<section id="books" aria-label="小说列表"></section>
</main>
</body>
</html>
